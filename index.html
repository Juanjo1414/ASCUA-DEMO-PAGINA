<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover deja que la página use toda la pantalla del celular;
         el espacio de la zona segura (notch, barra de inicio) se maneja con
         env(safe-area-inset-*) en los estilos. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Descripción genérica: el build inyecta la de cada restaurante en
         dist/r/<slug>/index.html. -->
    <meta
      name="description"
      content="Menú en 3D y realidad aumentada para restaurantes, directo desde el navegador y sin instalar nada."
    />
    <meta name="theme-color" content="#f4f3e7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Las tipografías se alojan en el sitio (scripts/fuentes.mjs): la
         política de seguridad no deja cargar fuentes de afuera. -->

    <title>Ascua — menú 3D y AR para restaurantes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
