# CI de ASCUA-DEMO-PAGINA
# - Corre en cada Pull Request hacia main y es reutilizado por deploy.yml en cada push.
# - P-705: todos los scripts (typecheck, test:coverage, content:validate, arch:check,
#   licenses:check) ya existen, así que corren siempre y una falla real detiene el job.
# - `ubuntu-24.04` fijo (no `ubuntu-latest`): la imagen por defecto migra a Ubuntu 26
#   el 2026-10-19 y no queremos que ese cambio nos tome por sorpresa sin probarlo antes.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage
      - name: Validación de contenido (esquema + aislamiento + pesos + aprobado)
        run: npm run content:validate
      - name: Reglas de arquitectura (capas)
        run: npm run arch:check
      - name: Build
        run: npm run build
      - name: Licencias de dependencias
        run: npm run licenses:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Navegadores de Playwright
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (Desktop, Pixel, iPhone) + accesibilidad + aislamiento
        if: hashFiles('playwright.config.ts') != ''
        run: npm run test:e2e
      - name: Lighthouse CI
        if: hashFiles('lighthouserc.json') != ''
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción (bloquea en high/critical)
        run: npm audit --omit=dev --audit-level=high
