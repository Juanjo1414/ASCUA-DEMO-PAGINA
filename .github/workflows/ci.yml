# CI de ASCUA-DEMO-PAGINA
# - Corre en cada Pull Request hacia main y es reutilizado por deploy.yml en cada push.
# - Adopción gradual: los pasos con `--if-present` se activan solos cuando la tarea
#   correspondiente crea el script (P-101 typecheck/test, P-202 content:validate,
#   P-108 arch:check). En P-705 se quita `--if-present` para volverlos obligatorios.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck --if-present
      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage --if-present
      - name: Validación de contenido (esquema + aislamiento + pesos + aprobado)
        run: npm run content:validate --if-present
      - name: Reglas de arquitectura (capas)
        run: npm run arch:check --if-present
      - name: Build
        run: npm run build
      - name: Licencias de dependencias
        run: npm run licenses:check --if-present
      - uses: actions/upload-artifact@v4 # TODO(X-008): fijar por SHA
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4 # TODO(X-008): fijar por SHA
        with:
          name: dist
          path: dist
      - name: Navegadores de Playwright
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (Desktop, Pixel, iPhone) + accesibilidad + aislamiento
        if: hashFiles('playwright.config.ts') != ''
        run: npm run test:e2e
      - name: Lighthouse CI
        if: hashFiles('lighthouserc.json') != ''
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4 # TODO(X-008): fijar por SHA
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2 # TODO(X-008): fijar por SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción (bloquea en high/critical)
        run: npm audit --omit=dev --audit-level=high
